<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 iPhone</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #0d0e10;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* 브라우저 높이에 맞춰지는 아이폰 화면 */
.phone {
  position: relative;
  height: min(100dvh, 216.7939vw);
  aspect-ratio: 393 / 852;
  overflow: hidden;
  isolation: isolate;
  container-type: inline-size;
  border-radius: min(5dvh, 10vw);
  background: #25262a;
}

/* 배경 사진 */
.wallpaper {
  position: absolute;
  inset: 0;
  z-index: -2;
  background: url("wallpaper.jpg") center / cover no-repeat;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    rgba(0, 0, 0, .24),
    transparent 38%,
    rgba(0, 0, 0, .08) 65%,
    rgba(0, 0, 0, .3)
  );
}

svg {
  display: block;
}

/* 상태 표시줄 */
.status {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 15cqw;
  padding: 5.2cqw 7cqw 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.small-time {
  font-size: 4.1cqw;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -.15cqw;
}

.island {
  position: absolute;
  top: 2.8cqw;
  left: 50%;
  transform: translateX(-50%);
  width: 31.8cqw;
  height: 9.4cqw;
  border-radius: 6cqw;
  background: black;
}

.indicators {
  display: flex;
  align-items: center;
  gap: 1.5cqw;
}

.signal {
  width: 4.6cqw;
  height: 3.4cqw;
}

.wifi {
  width: 4.5cqw;
  height: 3.5cqw;
}

.battery {
  width: 6.5cqw;
  height: 3.4cqw;
}

/* 날짜와 시계 */
.clock {
  position: absolute;
  top: 27cqw;
  left: 0;
  width: 100%;
  text-align: center;
}

.date {
  font-size: 5.5cqw;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -.2cqw;
}

.time {
  display: flex;
  justify-content: center;
  align-items: baseline;
  margin-top: 1.2cqw;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  font-size: 30cqw;
  line-height: 1;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -1.8cqw;
  white-space: nowrap;
}

.time .colon {
  display: inline-block;
  margin: 0 .2cqw 0 -.2cqw;
  transform: translateY(-.6cqw);
}

/* 시계가 네 자리일 때 폭 조절 */
.time.long-time {
  font-size: 28cqw;
}

.language {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 1.6cqw;
  margin-top: 5cqw;
  padding: 1.6cqw 3.4cqw;
  border-radius: 8cqw;
  background: rgba(58, 57, 55, .85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  font-size: 3.7cqw;
  font-weight: 600;
}

.language svg {
  width: 4.3cqw;
  height: 4.3cqw;
}

/* 알림 */
.notifications {
  position: absolute;
  bottom: 38cqw;
  left: 2.5cqw;
  right: 2.5cqw;
  display: grid;
  gap: 1.6cqw;
}

.notification {
  min-height: 17cqw;
  display: flex;
  align-items: center;
  gap: 3.2cqw;
  padding: 3.2cqw 3.7cqw;
  border-radius: 8cqw;
  background: rgba(65, 64, 73, .76);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
}

.app-icon {
  flex-shrink: 0;
  width: 10.2cqw;
  height: 10.2cqw;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 2.6cqw;
}

.message-icon {
  background: #2acb54;
}

.message-icon svg {
  width: 7cqw;
  height: 7cqw;
}

.calendar-icon {
  background: white;
  color: #333;
  font-size: 6cqw;
}

.content {
  flex: 1;
  min-width: 0;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 2cqw;
}

.heading strong {
  font-size: 3.8cqw;
  font-weight: 700;
  letter-spacing: -.12cqw;
}

.heading span {
  flex-shrink: 0;
  font-size: 3cqw;
  color: #bdbcc3;
}

.content p {
  margin: .4cqw 0 0;
  font-size: 3.6cqw;
  line-height: 1.25;
  letter-spacing: -.1cqw;
}

/* 하단 버튼 */
.controls {
  position: absolute;
  bottom: 12cqw;
  left: 12cqw;
  right: 12cqw;
  display: flex;
  justify-content: space-between;
}

.round-button {
  width: 13cqw;
  height: 13cqw;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  color: white;
  background: rgba(43, 43, 43, .8);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.round-button svg {
  width: 5.5cqw;
  height: 5.5cqw;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hint {
  position: absolute;
  bottom: 8cqw;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 3.3cqw;
  font-weight: 500;
  color: rgba(255, 255, 255, .68);
}

.home-bar {
  position: absolute;
  bottom: 2.2cqw;
  left: 50%;
  transform: translateX(-50%);
  width: 34cqw;
  height: 1.2cqw;
  border-radius: 2cqw;
  background: white;
}
</style>
</head>

<body>
<main class="phone" aria-label="아이폰 잠금 화면">
  <div class="wallpaper"></div>
  <div class="shade"></div>

  <header class="status">
    <span id="small-time" class="small-time"></span>
    <div class="island" aria-hidden="true"></div>

    <div class="indicators">
     <!-- 통신 신호: 막대 4개 -->
<svg class="signal" viewBox="0 0 20 16"
     role="img" aria-label="통신 신호">
  <g fill="white">
    <rect x="0" y="10" width="3.3" height="6" rx=".8"/>
    <rect x="5.3" y="7" width="3.3" height="9" rx=".8"/>
    <rect x="10.6" y="3.5" width="3.3" height="12.5" rx=".8"/>
    <rect x="15.9" y="0" width="3.3" height="16" rx=".8"/>
  </g>
</svg>

<!-- 와이파이: 부채꼴 곡선과 아래 점 -->
<svg class="wifi" viewBox="0 0 24 18"
     role="img" aria-label="와이파이">
  <g fill="white">
    <path d="
      M1.2 4.5
      Q12 -4 22.8 4.5
      L20.4 7
      Q12 .4 3.6 7
      Z"/>
    <path d="
      M5.4 8.8
      Q12 3.5 18.6 8.8
      L16.2 11.3
      Q12 8 7.8 11.3
      Z"/>
    <path d="
      M9.1 12.7
      Q12 10.4 14.9 12.7
      L12.8 15
      Q12 15.8 11.2 15
      Z"/>
  </g>
</svg>

      <!-- 배터리 -->
      <svg class="battery" viewBox="0 0 30 15"
           role="img" aria-label="배터리">
        <rect x=".7" y=".7" width="25" height="13"
              rx="3.5" fill="none"
              stroke="white" stroke-opacity=".6"
              stroke-width="1.2"/>
        <rect x="2.7" y="2.7" width="21" height="9"
              rx="1.6" fill="white"/>
        <path d="M27 5v5c2.4 0 2.4-5 0-5Z"
              fill="white" fill-opacity=".65"/>
      </svg>
    </div>
  </header>

  <section class="clock" aria-label="날짜와 시간">
    <div id="date" class="date"></div>

    <div id="time" class="time">
      <span id="hours"></span>
      <span class="colon">:</span>
      <span id="minutes"></span>
    </div>

    <div class="language">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="white" stroke-width="1.5"
           aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <ellipse cx="12" cy="12" rx="4" ry="9"/>
        <path d="M3 12h18 M5 6.5h14 M5 17.5h14"/>
      </svg>
      한국어
    </div>
  </section>

  <section class="notifications" aria-label="알림">
    <article class="notification">
      <div class="app-icon message-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="white"
                d="M12 3C6.5 3 2 6.6 2 11
                   c0 2.5 1.4 4.8 3.6 6.3L4.5 21
                   l4.4-2.2c1 .2 2 .3 3.1.3
                   5.5 0 10-3.6 10-8.1S17.5 3 12 3Z"/>
        </svg>
      </div>

      <div class="content">
        <div class="heading">
          <strong>재현이 형</strong>
          <span>지금</span>
        </div>
        <p>동현아 전화해</p>
      </div>
    </article>

    <article class="notification">
      <div class="app-icon calendar-icon">♡</div>

      <div class="content">
        <div class="heading">
          <strong>한동민 생일 D+71</strong>
          <span>지금</span>
        </div>
        <p>8월 10일</p>
      </div>
    </article>
  </section>

  <div class="controls">
    <button class="round-button" type="button"
            aria-label="손전등 모양">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 2h8v5l-2 3v11h-4V10L8 7Z
                 M8 6h8 M12 12v4"/>
      </svg>
    </button>

    <button class="round-button" type="button"
            aria-label="카메라 모양">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7h5l2-3h4l2 3h5v13H3Z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
  </div>

  <div class="hint">위로 쓸어올려 열기</div>
  <div class="home-bar" aria-hidden="true"></div>
</main>

<script>
function updateClock() {
  const now = new Date();
  const hours = String(now.getHours());
  const minutes = String(now.getMinutes()).padStart(2, "0");

  document.getElementById("hours").textContent = hours;
  document.getElementById("minutes").textContent = minutes;

  document.getElementById("small-time").textContent =
    hours + ":" + minutes;

  document.getElementById("time").classList.toggle(
    "long-time",
    hours.length === 2
  );

  document.getElementById("date").textContent =
    now.toLocaleDateString("ko-KR", {
      month: "long",
      day: "numeric",
      weekday: "long"
    });
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
setInterval(updateClock, 1000);
</script>
</body>
</html>
