<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 iPhone</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  display: grid;
  place-items: center;
  height: 100dvh;
  overflow: hidden;
  background: #0d0e10;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

[hidden] { display: none !important; }

.phone {
  position: relative;
  width: min(100vw, 58.24176dvh);
  aspect-ratio: 530 / 910;
  overflow: hidden;
  isolation: isolate;
  container-type: inline-size;
  border-radius: min(3dvh, 5vw);
  background: #24272b;
}

.wallpaper {
  position: absolute;
  inset: 0;
  z-index: -2;
  background: url("wallpaper.jpg") center / cover no-repeat;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(#0003, transparent 40%, #0004);
}

svg { display: block; }

/* 상태 표시줄 */
.status {
  position: absolute;
  z-index: 10;
  top: 2.7%;
  left: 6%;
  right: 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.small-time {
  font-size: 3.8cqw;
  font-weight: 700;
  letter-spacing: -.15cqw;
}

.island {
  position: absolute;
  z-index: 10;
  top: 1.65%;
  left: 50%;
  transform: translateX(-50%);
  width: 33%;
  height: 4.6%;
  border-radius: 10cqw;
  background: black;
  pointer-events: none;
}

.indicators {
  display: flex;
  align-items: center;
  gap: 1.4cqw;
}

.signal { width: 4.4cqw; height: 3cqw; }
.wifi { width: 3.8cqw; height: 3cqw; }
.battery { width: 6.1cqw; height: 3.1cqw; }

.screen {
  position: absolute;
  inset: 0;
}

/* 앞에서 움직이는 잠금 화면 */
.lock-screen {
  z-index: 2;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  will-change: transform, opacity;
}

.clock {
  position: absolute;
  top: 14%;
  width: 100%;
  text-align: center;
}

.date {
  font-size: 5.3cqw;
  font-weight: 700;
  letter-spacing: -.2cqw;
}

.time {
  margin-top: 1cqw;
  font-size: 29cqw;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -1.7cqw;
  font-variant-numeric: tabular-nums;
}

.language {
  display: inline-flex;
  align-items: center;
  gap: 1.5cqw;
  margin-top: 5cqw;
  padding: 1.5cqw 3cqw;
  border-radius: 8cqw;
  background: #343434a6;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  font-size: 3.5cqw;
  font-weight: 600;
}

.language svg {
  width: 4cqw;
  height: 4cqw;
}

.lock-controls {
  position: absolute;
  bottom: 7%;
  left: 12%;
  right: 12%;
  display: flex;
  justify-content: space-between;
}

.round {
  width: 13cqw;
  height: 13cqw;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #292929a6;
}

.round svg {
  width: 5cqw;
  height: 5cqw;
  fill: none;
  stroke: white;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.unlock-hint {
  position: absolute;
  bottom: 4%;
  left: 50%;
  transform: translateX(-50%);
  border: 0;
  padding: 2cqw;
  background: none;
  white-space: nowrap;
  font-size: 3.3cqw;
  color: #ffffffbf;
}

/* 뒤에 고정된 비밀번호 화면 */
.passcode-screen {
  z-index: 1;
  background: rgba(10, 12, 14, .38);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  will-change: opacity;
}

.passcode-title {
  position: absolute;
  top: 16.4%;
  left: 0;
  width: 100%;
  margin: 0;
  text-align: center;
  font-size: 4.2cqw;
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -.13cqw;
  outline: none;
}

.dots {
  position: absolute;
  top: 22.7%;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 3.8cqw;
}

.dot {
  width: 3.4cqw;
  height: 3.4cqw;
  border: 1px solid white;
  border-radius: 50%;
}

.dot.filled { background: white; }

.feedback {
  position: absolute;
  top: 26.5%;
  left: 5%;
  width: 90%;
  margin: 0;
  text-align: center;
  font-size: 2.8cqw;
}

.keypad {
  position: absolute;
  top: 31.75%;
  left: 15.5%;
  width: 69%;
  display: grid;
  grid-template-columns: repeat(3, 20cqw);
  justify-content: space-between;
  row-gap: 3.8cqw;
}

.key {
  position: relative;
  width: 20cqw;
  height: 20cqw;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .21);
}

.key:active {
  background: rgba(255, 255, 255, .45);
}

.number {
  position: absolute;
  top: 3.5cqw;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 9.5cqw;
  line-height: 1;
  font-weight: 300;
}

.letters {
  position: absolute;
  top: 14cqw;
  left: 0;
  width: 100%;
  padding-left: .35cqw;
  text-align: center;
  font-size: 2.4cqw;
  line-height: 1;
  font-weight: 700;
  letter-spacing: .35cqw;
}

.zero { grid-column: 2; }

.zero .number {
  top: 50%;
  transform: translateY(-50%);
}

.passcode-actions {
  position: absolute;
  top: 87%;
  left: 15.5%;
  width: 69%;
  display: flex;
  justify-content: space-between;
}

.text-button {
  border: 0;
  padding: 1cqw 3cqw;
  background: none;
  font-size: 3.5cqw;
  font-weight: 600;
}

.home-bar {
  position: absolute;
  z-index: 12;
  bottom: .8%;
  left: 50%;
  transform: translateX(-50%);
  width: 34%;
  height: 1cqw;
  border-radius: 2cqw;
  background: white;
  pointer-events: none;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-2cqw); }
  40%, 80% { transform: translateX(2cqw); }
}

.shake { animation: shake .35s; }

.home-screen { z-index: 3; }

.home-title {
  position: absolute;
  top: 20%;
  width: 100%;
  margin: 0;
  text-align: center;
  font-size: 6cqw;
  outline: none;
}

.lock-again {
  position: absolute;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  border: 0;
  border-radius: 5cqw;
  padding: 3cqw 6cqw;
  background: #ffffff30;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  font-size: 4cqw;
}

@media (prefers-reduced-motion: reduce) {
  .shake { animation: none; }
}
</style>
</head>

<body>
<main class="phone">
  <div class="wallpaper"></div>
  <div class="shade"></div>
  <div class="island" aria-hidden="true"></div>

  <header class="status">
    <span id="small-time" class="small-time"></span>

    <div class="indicators">
      <svg class="signal" viewBox="0 0 20 16"
           role="img" aria-label="통신 신호">
        <g fill="white">
          <rect x="0" y="10" width="3.3" height="6" rx=".8"/>
          <rect x="5.3" y="7" width="3.3" height="9" rx=".8"/>
          <rect x="10.6" y="3.5" width="3.3" height="12.5" rx=".8"/>
          <rect x="15.9" y="0" width="3.3" height="16" rx=".8"/>
        </g>
      </svg>

      <svg class="wifi" viewBox="0 0 24 18"
           role="img" aria-label="와이파이">
        <g fill="white">
          <path d="M1.2 4.5Q12 -4 22.8 4.5L20.4 7Q12 .4 3.6 7Z"/>
          <path d="M5.4 8.8Q12 3.5 18.6 8.8L16.2 11.3Q12 8 7.8 11.3Z"/>
          <path d="M9.1 12.7Q12 10.4 14.9 12.7L12.8 15Q12 15.8 11.2 15Z"/>
        </g>
      </svg>

      <svg class="battery" viewBox="0 0 30 15"
           role="img" aria-label="배터리">
        <rect x=".7" y=".7" width="25" height="13"
              rx="3.5" fill="none" stroke="white"
              stroke-opacity=".6" stroke-width="1.2"/>
        <rect x="2.7" y="2.7" width="21" height="9"
              rx="1.6" fill="white"/>
        <path d="M27 5v5c2.4 0 2.4-5 0-5Z"
              fill="white" fill-opacity=".65"/>
      </svg>
    </div>
  </header>

  <section id="lock-screen" class="screen lock-screen">
    <div class="clock">
      <div id="date" class="date"></div>
      <div id="time" class="time"></div>

      <div class="language">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="white" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <ellipse cx="12" cy="12" rx="4" ry="9"/>
          <path d="M3 12h18 M5 6.5h14 M5 17.5h14"/>
        </svg>
        한국어
      </div>
    </div>

    <div class="lock-controls" aria-hidden="true">
      <div class="round">
        <svg viewBox="0 0 24 24">
          <path d="M8 2h8v5l-2 3v11h-4V10L8 7Z M8 6h8 M12 12v4"/>
        </svg>
      </div>
      <div class="round">
        <svg viewBox="0 0 24 24">
          <path d="M3 7h5l2-3h4l2 3h5v13H3Z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
    </div>

    <button id="unlock-hint" class="unlock-hint" type="button">
      위로 쓸어올려 열기
    </button>
  </section>

  <section id="passcode-screen" class="screen passcode-screen"
           aria-labelledby="passcode-title" hidden inert>
    <h1 id="passcode-title" class="passcode-title" tabindex="-1">
      암호 입력
    </h1>

    <div id="dots" class="dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <p id="feedback" class="feedback" role="status"></p>
    <div id="keypad" class="keypad" aria-label="암호 키패드"></div>

    <div class="passcode-actions">
      <button id="emergency" class="text-button" type="button">
        긴급 상황
      </button>
      <button id="cancel-delete" class="text-button" type="button">
        취소
      </button>
    </div>
  </section>

  <section id="home-screen" class="screen home-screen" hidden inert>
    <h1 id="home-title" class="home-title" tabindex="-1">홈 화면</h1>
    <button id="lock-again" class="lock-again" type="button">
      다시 잠그기
    </button>
  </section>

  <div class="home-bar"></div>
</main>

<script>
const lockScreen = document.getElementById("lock-screen");
const passcodeScreen = document.getElementById("passcode-screen");
const homeScreen = document.getElementById("home-screen");
const dotsContainer = document.getElementById("dots");
const dots = [...document.querySelectorAll(".dot")];
const feedback = document.getElementById("feedback");
const actionButton = document.getElementById("cancel-delete");

let screen = "lock";
let code = "";
let checking = false;
let timer;

let gesture = null;
let animating = false;
let dragging = false;
let lastY = 0;
let lastTime = 0;
let velocity = 0;
let suppressClickUntil = 0;

const letters = {
  1: "", 2: "ABC", 3: "DEF", 4: "GHI", 5: "JKL",
  6: "MNO", 7: "PQRS", 8: "TUV", 9: "WXYZ", 0: ""
};

/* 숫자 키패드 */
for (const digit of ["1","2","3","4","5","6","7","8","9","0"]) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "key" + (digit === "0" ? " zero" : "");
  button.setAttribute("aria-label", digit);

  const number = document.createElement("span");
  number.className = "number";
  number.textContent = digit;
  button.appendChild(number);

  if (letters[digit]) {
    const label = document.createElement("span");
    label.className = "letters";
    label.textContent = letters[digit];
    button.appendChild(label);
  }

  button.addEventListener("click", () => enterDigit(digit));
  document.getElementById("keypad").appendChild(button);
}

function updateClock() {
  const now = new Date();
  const time = now.getHours() + ":" +
    String(now.getMinutes()).padStart(2, "0");

  document.getElementById("small-time").textContent = time;
  document.getElementById("time").textContent = time;
  document.getElementById("date").textContent =
    now.toLocaleDateString("ko-KR", {
      month: "long", day: "numeric", weekday: "long"
    });
}

function updateInput() {
  dots.forEach((dot, i) => {
    dot.classList.toggle("filled", i < code.length);
  });
  actionButton.textContent = code.length ? "지우기" : "취소";
}

function resetCode() {
  clearTimeout(timer);
  code = "";
  checking = false;
  feedback.textContent = "";
  dotsContainer.classList.remove("shake");
  updateInput();
}

function showScreen(name) {
  screen = name;

  [
    [lockScreen, "lock"],
    [passcodeScreen, "passcode"],
    [homeScreen, "home"]
  ].forEach(([element, state]) => {
    element.hidden = name !== state;
    element.inert = name !== state;
  });
}

function enterDigit(digit) {
  if (screen !== "passcode" || checking) return;

  feedback.textContent = "";
  code += digit;
  updateInput();

  if (code.length !== 4) return;
  checking = true;

  if (code === "1020") {
    timer = setTimeout(() => {
      resetCode();
      showScreen("home");
      document.getElementById("home-title").focus();
    }, 180);
  } else {
    dotsContainer.classList.add("shake");
    feedback.textContent = "암호가 올바르지 않습니다";
    timer = setTimeout(resetCode, 650);
  }
}

actionButton.addEventListener("click", () => {
  if (checking) return;

  if (code.length) {
    code = code.slice(0, -1);
    feedback.textContent = "";
    updateInput();
  } else {
    resetCode();
    showScreen("lock");
    document.getElementById("unlock-hint").focus();
  }
});

document.getElementById("emergency").addEventListener("click", () => {
  if (!checking) {
    feedback.textContent = "웹사이트에서는 긴급 전화를 걸 수 없습니다.";
  }
});

document.getElementById("lock-again").addEventListener("click", () => {
  resetCode();
  showScreen("lock");
  document.getElementById("unlock-hint").focus();
});

/* 비밀번호 화면은 처음부터 제자리에 고정 */
function prepareSwipe() {
  resetCode();
  passcodeScreen.hidden = false;
  passcodeScreen.inert = true;
  passcodeScreen.style.opacity = "0";
  passcodeScreen.style.pointerEvents = "none";
}

/* 잠금 화면만 위로 이동 */
function paintSwipe(distance) {
  const height = lockScreen.clientHeight;
  const progress = Math.min(distance / (height * .5), 1);

  lockScreen.style.transform = `translateY(${-distance}px)`;
  lockScreen.style.opacity = String(1 - progress);

  /* 암호 화면에는 이동 효과를 적용하지 않음 */
  passcodeScreen.style.opacity = String(progress);
}

function clearSwipeStyles() {
  lockScreen.style.transition = "";
  lockScreen.style.transform = "";
  lockScreen.style.opacity = "";

  passcodeScreen.style.transition = "";
  passcodeScreen.style.opacity = "";
  passcodeScreen.style.pointerEvents = "";
}

function finishSwipe(open) {
  if (animating) return;

  animating = true;
  gesture = null;

  const reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  const duration = reduceMotion ? 0 : 360;
  const easing = "cubic-bezier(.22, 1, .36, 1)";

  lockScreen.style.transition =
    `transform ${duration}ms ${easing}, opacity ${duration}ms ${easing}`;

  /* 비밀번호 화면은 투명도만 변경 */
  passcodeScreen.style.transition =
    `opacity ${duration}ms ${easing}`;

  void lockScreen.offsetHeight;

  if (open) {
    lockScreen.style.transform =
      `translateY(${-lockScreen.clientHeight * .65}px)`;
    lockScreen.style.opacity = "0";
    passcodeScreen.style.opacity = "1";
  } else {
    lockScreen.style.transform = "translateY(0)";
    lockScreen.style.opacity = "1";
    passcodeScreen.style.opacity = "0";
  }

  setTimeout(() => {
    showScreen(open ? "passcode" : "lock");
    clearSwipeStyles();

    animating = false;
    dragging = false;

    if (open) {
      document.getElementById("passcode-title").focus();
    }
  }, duration);
}

/* 터치·마우스 드래그 */
lockScreen.addEventListener("pointerdown", event => {
  if (screen !== "lock" || animating) return;
  if (!event.isPrimary || event.button !== 0) return;

  gesture = {
    id: event.pointerId,
    x: event.clientX,
    y: event.clientY
  };

  lastY = event.clientY;
  lastTime = performance.now();
  velocity = 0;
  dragging = false;

  /* 안내 버튼의 일반 클릭도 유지 */
  if (!event.target.closest("button")) {
    lockScreen.setPointerCapture(event.pointerId);
  }
});

lockScreen.addEventListener("pointermove", event => {
  if (!gesture || gesture.id !== event.pointerId) return;

  const up = gesture.y - event.clientY;
  const sideways = Math.abs(gesture.x - event.clientX);

  if (!dragging) {
    if (up < 5 || up < sideways) return;

    dragging = true;
    lockScreen.setPointerCapture(event.pointerId);
    prepareSwipe();
  }

  const now = performance.now();

  velocity = (lastY - event.clientY) /
    Math.max(now - lastTime, 1);

  lastY = event.clientY;
  lastTime = now;

  paintSwipe(Math.max(0, up));
});

lockScreen.addEventListener("pointerup", event => {
  if (!gesture || gesture.id !== event.pointerId) return;

  const up = Math.max(0, gesture.y - event.clientY);
  const moved = dragging;
  gesture = null;

  if (!moved) return;

  /* 드래그 뒤 발생하는 클릭으로 다시 열리는 현상 방지 */
  suppressClickUntil = performance.now() + 500;

  if (performance.now() - lastTime > 100) {
    velocity = 0;
  }

  const enoughDistance = up > lockScreen.clientHeight * .18;
  const quickSwipe = up > 25 && velocity > .45;

  finishSwipe(enoughDistance || quickSwipe);
});

function cancelSwipe() {
  if (gesture && dragging && !animating) {
    finishSwipe(false);
  }
  gesture = null;
}

lockScreen.addEventListener("pointercancel", cancelSwipe);
lockScreen.addEventListener("lostpointercapture", cancelSwipe);

/* 키보드로도 접근 가능한 안내 버튼 */
document.getElementById("unlock-hint")
  .addEventListener("click", () => {
    if (performance.now() < suppressClickUntil) return;
    if (screen !== "lock" || animating || dragging) return;

    prepareSwipe();
    finishSwipe(true);
  });

updateClock();
updateInput();
setInterval(updateClock, 1000);
</script>
</body>
</html>
