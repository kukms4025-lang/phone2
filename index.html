<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 iPhone</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  background: #0d0e10;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               Arial, sans-serif;
  color: white;
}

button { font: inherit; color: inherit; cursor: pointer; }

.phone {
  position: relative;
  width: min(100vw, 390px);
  height: min(100dvh, 844px);
  overflow: hidden;
  border-radius: 34px;
  background: #292c32;
  isolation: isolate;
}

/* 같은 저장소에 wallpaper.jpg를 추가하면 배경에 표시돼 */
.wallpaper {
  position: absolute;
  inset: 0;
  z-index: -2;
  background: url("wallpaper.jpg") center / cover no-repeat;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    to bottom, #0003, transparent 40%, #0002 65%, #0005
  );
}

.status {
  height: 45px;
  padding: 13px 23px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  font-size: 15px;
  font-weight: 600;
}

.island {
  position: absolute;
  top: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 124px;
  height: 32px;
  border-radius: 24px;
  background: black;
}

.indicators {
  display: flex;
  align-items: center;
  gap: 7px;
}

.battery {
  width: 23px;
  height: 12px;
  border: 1px solid #fffc;
  border-radius: 4px;
  padding: 2px;
  position: relative;
}

.battery::before {
  content: "";
  display: block;
  height: 100%;
  background: white;
  border-radius: 1px;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: #fffc;
  border-radius: 1px;
}

.clock {
  text-align: center;
  padding-top: 28px;
  text-shadow: 0 2px 12px #0002;
}

#date {
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -1px;
}

#time {
  font-size: 108px;
  font-weight: 650;
  line-height: 1.08;
  letter-spacing: -7px;
  padding-right: 7px;
}

.language {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 17px;
  padding: 6px 13px;
  border-radius: 22px;
  background: #3339;
  backdrop-filter: blur(20px);
  font-size: 14px;
  font-weight: 600;
}

.notifications {
  position: absolute;
  bottom: 126px;
  left: 10px;
  right: 10px;
  display: grid;
  gap: 7px;
}

.notification {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 68px;
  padding: 12px 14px;
  border-radius: 27px;
  background: #48474eb8;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: inset 0 1px 0 #ffffff12;
}

.message-icon, .calendar-icon {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 11px;
  display: grid;
  place-items: center;
}

.message-icon { background: #28c653; }

.calendar-icon {
  background: white;
  color: #222;
  font-size: 24px;
  font-weight: 500;
}

.content { flex: 1; min-width: 0; }

.heading {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.heading strong { font-size: 15px; }
.heading span { color: #d0cfd4; font-size: 12px; }
.content p { margin: 3px 0 0; font-size: 14px; }

.controls {
  position: absolute;
  bottom: 43px;
  left: 29px;
  right: 29px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.round-button {
  width: 50px;
  height: 50px;
  border: 0;
  border-radius: 50%;
  background: #252527a6;
  backdrop-filter: blur(15px);
  display: grid;
  place-items: center;
}

.hint {
  position: absolute;
  bottom: 44px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 12px;
  color: #ffffffb3;
  pointer-events: none;
}

.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  border-radius: 5px;
  background: white;
}

svg {
  display: block;
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (max-width: 430px) {
  .phone {
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
  }
}
</style>
</head>

<body>
<main class="phone">
  <div class="wallpaper"></div>
  <div class="shade"></div>

  <header class="status">
    <span id="small-time"></span>
    <div class="island"></div>

    <div class="indicators">
      <svg viewBox="0 0 24 24"
           style="width:17px;height:15px;stroke-width:3"
           aria-label="통신 신호">
        <path d="M3 20v-3 M9 20v-7 M15 20V9 M21 20V4"/>
      </svg>

      <svg viewBox="0 0 24 24"
           style="width:17px;height:17px"
           aria-label="와이파이">
        <path d="M2 8a16 16 0 0 1 20 0
                 M5 12a11 11 0 0 1 14 0
                 M9 16a5 5 0 0 1 6 0"/>
        <circle cx="12" cy="20" r=".7" fill="currentColor"/>
      </svg>

      <div class="battery" aria-label="배터리"></div>
    </div>
  </header>

  <section class="clock">
    <div id="date"></div>
    <div id="time"></div>
    <div class="language">
      <span style="font-size:19px">◎</span> 한국어
    </div>
  </section>

  <section class="notifications" aria-label="알림">
    <article class="notification">
      <div class="message-icon">
        <svg viewBox="0 0 24 24"
             style="fill:white;stroke:none;width:29px;height:29px">
          <path d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.8 3.6 6.3L4.5 21
                   l4.4-2.2c1 .2 2 .3 3.1.3 5.5 0 10-3.6 10-8.1S17.5 3 12 3Z"/>
        </svg>
      </div>
      <div class="content">
        <div class="heading">
          <strong>메시지</strong><span>지금</span>
        </div>
        <p>알림 내용을 여기에 적어줘</p>
      </div>
    </article>

    <article class="notification">
      <div class="calendar-icon">♡</div>
      <div class="content">
        <div class="heading">
          <strong>기념일</strong><span>지금</span>
        </div>
        <p>기억하고 싶은 날짜</p>
      </div>
    </article>
  </section>

  <div class="controls">
    <button class="round-button" aria-label="손전등">
      <svg viewBox="0 0 24 24">
        <path d="M8 2h8v5l-2 3v11h-4V10L8 7Z M8 6h8 M12 12v4"/>
      </svg>
    </button>

    <button class="round-button" aria-label="카메라">
      <svg viewBox="0 0 24 24">
        <path d="M3 7h5l2-3h4l2 3h5v13H3Z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
  </div>

  <div class="hint">위로 쓸어올려 열기</div>
  <div class="home-bar"></div>
</main>

<script>
function updateClock() {
  const now = new Date();

  const time = now.toLocaleTimeString("en-GB", {
    hour: "numeric",
    minute: "2-digit",
    hour12: false
  }).replace(/^0/, "");

  document.getElementById("time").textContent = time;
  document.getElementById("small-time").textContent = time;

  document.getElementById("date").textContent =
    now.toLocaleDateString("ko-KR", {
      month: "long",
      day: "numeric",
      weekday: "long"
    });
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
